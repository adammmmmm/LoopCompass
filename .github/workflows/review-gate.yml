name: review-policy
run-name: review-policy-${{ github.event.action || 'manual' }}-pr-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request_number }}

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to re-evaluate
        required: true
        type: number
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: review-policy-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  evaluate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted policy implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Evaluate review policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/review-gate.mjs github
