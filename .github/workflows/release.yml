name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Verify (tests + release inventory)
        run: node scripts/verify.mjs

  release-package:
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Release pin status
        # Source-tree manifest.commit may lag the tag commit by one generate cycle.
        # package rewrites the archived manifest.commit to HEAD (the tag SHA).
        run: node scripts/release.mjs pin-check
      - name: Package release archive
        run: node scripts/release.mjs package
      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loopcompass-release-dist
          path: |
            dist/loopcompass-v*.tar.gz
            dist/SHA256SUMS
